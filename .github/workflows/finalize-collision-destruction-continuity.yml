name: Finalize collision destruction continuity

on:
  push:
    branches:
      - fix/collision-destruction-continuity

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/collision-destruction-continuity

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Apply scoped finalization
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          handoff = Path('src/rendering/collisionSolidHandoff.ts')
          text = handoff.read_text()

          assert 'const ABSORBED_CONTACT_RETREAT_RATIO = 0.2\n' in text
          text = text.replace('const ABSORBED_CONTACT_RETREAT_RATIO = 0.2\n', '', 1)

          scale_vector = '''function scaleVector(value: Vec3, scale: number): Vec3 {
            return { x: value.x * scale, y: value.y * scale, z: value.z * scale }
          }

          '''
          assert scale_vector in text
          text = text.replace(scale_vector, '', 1)

          retreat_pattern = re.compile(
              r"      const contactRetreat = scaleVector\(\n"
              r"        contactNormal,\n"
              r"        -startRadius \* \(1 - absorbedProgress\.contactAxisScale\) \* ABSORBED_CONTACT_RETREAT_RATIO,\n"
              r"      \)\n"
          )
          text, count = retreat_pattern.subn('', text, count=1)
          assert count == 1
          assert 'position: add(inwardPosition, contactRetreat)' in text
          text = text.replace('position: add(inwardPosition, contactRetreat)', 'position: inwardPosition', 1)
          assert 'ABSORBED_CONTACT_RETREAT_RATIO' not in text
          assert 'scaleVector(' not in text
          handoff.write_text(text)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          assert package['version'] == '0.20.7'
          package['version'] = '0.20.8'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          marker = '## [0.20.7] - 2026-08-31'
          assert marker in changelog
          assert '## [0.20.8]' not in changelog
          entry = '''## [0.20.8] - 2026-08-31

          ### Fixed
          - 비항성 2→1 충돌의 solid handoff에서 피흡수체가 균일한 작은 구체로 축소된 뒤 마지막 프레임에 삭제되던 표현을, 접촉축 변형이 먼저 진행되고 후반에 본체 collapse와 fade가 이어지는 순차 전환으로 변경했습니다.
          - 접촉면 변형을 위한 추가 중심 위치 보정을 제거해 v0.20.7의 post-impact motion/solid-handoff 이동 경로를 그대로 유지합니다.

          ### Added
          - absorbed solid의 contact-axis erosion → body collapse → final fade 순서와 단조 수렴을 검증하는 회귀 체크를 추가했습니다.

          ### Unchanged
          - collision solver의 mass/velocity/trajectory/outcome, 기존 physical fragment/ejecta 방향·속도, stellar collision, camera, flash 및 Stage 5 VFX는 변경하지 않습니다.

          '''
          changelog = changelog.replace(marker, entry + marker, 1)
          changelog_path.write_text(changelog)
          PY

      - name: Check scoped diff
        run: |
          git diff --check
          git status --short
          test "$(git status --short | awk '{print $2}' | sort | tr '\n' ' ')" = "CHANGELOG.md package.json src/rendering/collisionSolidHandoff.ts "

      - name: Commit final scoped changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rendering/collisionSolidHandoff.ts package.json CHANGELOG.md
          git commit -m "fix: finalize collision destruction continuity"
          git push origin HEAD:fix/collision-destruction-continuity

      - name: Install dependencies
        run: npm install

      - name: Full build and regression suite
        run: npm run build

      - name: Install browser visual regression runtime
        run: python -m pip install --disable-pip-version-check --quiet selenium==4.35.0 pillow==11.3.0

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/3bp-preview.log 2>&1 &
          echo $! > /tmp/3bp-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/3BP/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/3bp-preview.log
          exit 1

      - name: Non-stellar destruction browser regression
        run: python scripts/nonStellarDestructionVisualRegression.py

      - name: Collision merge solid handoff browser regression
        run: python scripts/collisionMergeHandoffVisualRegression.py

      - name: Survivor absorption browser regression
        run: python scripts/survivorAbsorptionVisualRegression.py

      - name: Absorption continuity browser regression
        run: python scripts/absorptionContinuityVisualRegression.py

      - name: Collision penetration browser regression
        run: python scripts/collisionPenetrationVisualRegression.py

      - name: Collision ejecta browser regression
        run: python scripts/collisionEjectaVisualRegression.py

      - name: Collision frame continuity browser regression
        run: python scripts/collisionContinuityVisualRegression.py

      - name: Stellar collision browser regression
        run: python scripts/visualStellarCollisionRegression.py

      - name: Strict stellar collision visual gate
        run: python scripts/strictStellarCollisionVisualGate.py
