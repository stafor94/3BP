name: Pass 5 Tune Temp

on:
  push:
    branches:
      - feat/pass5-dense-starfield

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pass5-dense-starfield
          fetch-depth: 0
      - name: Apply final star visibility tuning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/rendering/spaceBackground.ts')
          text = source.read_text()
          replacements = {
              'const DENSE_BACKGROUND_STAR_COUNT = 2200': 'const DENSE_BACKGROUND_STAR_COUNT = 2500',
              'const FINE_BACKGROUND_STAR_COUNT = 1800': 'const FINE_BACKGROUND_STAR_COUNT = 2000',
              '    size: 1.45,\n    opacity: 0.82,\n    minBrightness: 0.27,\n    maxBrightness: 0.62,': '    size: 1.58,\n    opacity: 0.86,\n    minBrightness: 0.32,\n    maxBrightness: 0.67,',
              '    size: 1.12,\n    opacity: 0.70,\n    minBrightness: 0.18,\n    maxBrightness: 0.46,': '    size: 1.26,\n    opacity: 0.76,\n    minBrightness: 0.23,\n    maxBrightness: 0.50,',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected source text: {old!r}')
              text = text.replace(old, new, 1)
          source.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          replacements = {
              'background를 2,200개의 dense visible layer와 1,800개의 fine fill layer로 재구성했습니다. 총 stellar population은 5,000개입니다.': 'background를 2,500개의 dense visible layer와 2,000개의 fine fill layer로 재구성했습니다. 총 stellar population은 5,500개입니다.',
              'dense layer는 size 1.45, opacity 0.82, brightness 0.27~0.62로 모바일 screen-space에서 작은 점으로 지속적으로 읽히도록 했고, fine layer는 size 1.12, opacity 0.70, brightness 0.18~0.46으로 주력 layer 사이의 빈 공간을 채웁니다.': 'dense layer는 size 1.58, opacity 0.86, brightness 0.32~0.67로 모바일 screen-space에서 작은 점으로 지속적으로 읽히도록 했고, fine layer는 size 1.26, opacity 0.76, brightness 0.23~0.50으로 주력 layer 사이의 빈 공간을 채웁니다.',
              'background star는 1,850개에서 4,000개로 +2,150개 증가하며 position+color raw buffer 증가는 약 50.4 KiB입니다.': 'background star는 1,850개에서 4,500개로 +2,650개 증가하며 position+color raw buffer 증가는 약 62.1 KiB입니다.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected changelog text: {old!r}')
              text = text.replace(old, new, 1)
          changelog.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/rendering/spaceBackground.ts CHANGELOG.md
          git commit -m "tune: improve mobile starfield visibility"
          git push origin HEAD:feat/pass5-dense-starfield
