name: Temporary release prep

on:
  push:
    branches:
      - fix/collision-destruction-tracking-toggle

permissions:
  contents: write

jobs:
  prepare-release:
    if: github.event.head_commit.message != 'chore: release v0.19.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/collision-destruction-tracking-toggle
          fetch-depth: 0
      - name: Update version and changelog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['version'] = '0.19.1'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          marker = '## [0.19.0] - 2026-08-26'
          release = '''## [0.19.1] - 2026-08-26

### Changed
- 일반 고체 천체의 파괴 handoff를 약 820ms 동안 원본 표면이 온전히 보이는 상태에서 균열 경계가 진행되고 뒤이어 잔해가 방출되는 순서로 재조정했습니다.
- 충돌 직후 생성되는 비항성 잔존체·파편은 짧은 지연 뒤 크기와 불투명도가 점진적으로 나타나도록 교차 전환해 한 프레임에 완성된 파편이 튀어나오는 느낌을 줄였습니다.
- 왼쪽 추적 레일에서 현재 활성화된 천체를 다시 누르면 일반 추적을 해제하며, 카메라는 해제 직전의 마지막 위치와 시선 타깃을 그대로 유지합니다.

### Fixed
- v0.19.0에서 추적 레일이 매 프레임 현재 후보 질량으로 기준점을 다시 잡아 최초 질량의 50% 제한이 사실상 무력화되던 문제를 수정하고 기존 절반 질량 기준을 복원했습니다.
- 파괴 handoff 셰이더의 dissolve 임계값 방향이 반대로 적용되어 원본 천체 표면이 첫 프레임부터 대부분 잘려 보이던 문제를 수정했습니다.
- 충돌 결과 파편과 잔존체가 원본 천체 소멸과 동시에 완전한 크기·불투명도로 표시되어 파괴 전환이 갑자기 끊겨 보이던 문제를 수정했습니다.

'''
          if '## [0.19.1] - 2026-08-26' not in changelog:
              if marker not in changelog:
                  raise SystemExit('0.19.0 changelog marker not found')
              changelog = changelog.replace(marker, release + marker, 1)
              changelog_path.write_text(changelog)

          Path('.github/workflows/release-prep-temp.yml').unlink()
          PY
      - name: Commit release metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json CHANGELOG.md .github/workflows/release-prep-temp.yml
          git commit -m 'chore: release v0.19.1'
          git push origin HEAD:fix/collision-destruction-tracking-toggle
