name: Apply v0.19.6 merge tracking and trail patch

on:
  push:
    branches:
      - fix/merge-tracking-trail-continuity-v0.19.6

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/merge-tracking-trail-continuity-v0.19.6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply focused patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}')
              write(path, text.replace(old, new, 1))

          # Version + changelog.
          replace_once('package.json', '"version": "0.19.5"', '"version": "0.19.6"')
          changelog = read('CHANGELOG.md')
          marker = '## [0.19.5] - 2026-08-27\n'
          entry = '''## [0.19.6] - 2026-08-27

### Fixed
- 동일 질량 또는 일반 merge 충돌에서 두 원본 천체 모두 remnant의 명시적 tracking continuation으로 연결해, 기존 50% initial-mass rule을 통과하는 추적이 collision camera 종료 뒤에도 유지되도록 수정했습니다.
- collision camera가 merge 이후 이미 해제된 tracking 상태를 잠시 가리고 있다가 종료 순간 천체가 화면 밖으로 이동하던 실제 원인을 수정했습니다.
- merge로 원본 body id가 사라질 때 renderer가 해당 body의 과거 궤적까지 즉시 폐기하던 문제를 수정하고, 기존 trail duration이 끝날 때까지 충돌 전 궤적을 trail-only 상태로 유지하도록 했습니다.

### Added
- 실제 equal-mass planet merge를 통과시켜 양쪽 source tracking continuation과 50% mass gate를 검증하는 회귀 테스트를 추가했습니다.
- collision-camera handoff 브라우저 regression에 source body가 remnant로 교체된 뒤에도 충돌 전 source trail이 retained 상태로 남는 renderer telemetry 검증을 추가했습니다.

'''
          if marker not in changelog:
              raise SystemExit('CHANGELOG marker missing')
          write('CHANGELOG.md', changelog.replace(marker, entry + marker, 1))

          # Tracking continuation: absorption keeps the dominant absorber only;
          # true merges explicitly continue both merged physical sources.
          path = 'src/physics/fragmentAwareEngine.ts'
          text = read(path)
          text = text.replace('attachAbsorptionTrackingContinuity(input, withMassCorrection, dt)', 'attachCollisionTrackingContinuity(input, withMassCorrection, dt)', 1)
          start = text.index('function attachAbsorptionTrackingContinuity(')
          end = text.index('\nfunction smoothstep01', start)
          new_function = '''function attachCollisionTrackingContinuity(
            input: BodyState[],
            stepped: BodyState[],
            dt: number,
          ) {
            const collisionPair = findNewCollisionPair(input, stepped, dt)
            if (!collisionPair) return stepped

            const { bodyA, bodyB } = collisionPair
            const mode = inferCollisionPresentationMode(stepped, bodyA, bodyB)
            if (mode !== 'merge') return stepped

            const remnant = stepped.find((body) =>
              body.bodyType !== 'effect' &&
              body.bodyType !== 'fragment' &&
              body.id !== bodyA.id &&
              body.id !== bodyB.id &&
              isBodyDescendedFrom(body.id, bodyA.id) &&
              isBodyDescendedFrom(body.id, bodyB.id),
            )
            if (!remnant) return stepped

            let continuationSources: BodyState[]
            if (isAbsorptionCollision(bodyA, bodyB, mode)) {
              // Absorption is identity-asymmetric: only the dominant absorber keeps
              // ordinary user tracking. The absorbed source must not jump to it.
              const larger = bodyA.mass > bodyB.mass
                ? bodyA
                : bodyB.mass > bodyA.mass
                  ? bodyB
                  : null
              if (!larger) return stepped
              continuationSources = [larger]
            } else {
              // A true merge produces one body from both physical sources. Carry
              // both explicit source lineages; App.tsx still applies the captured
              // initial-mass 50% gate before ordinary tracking can continue.
              continuationSources = [bodyA, bodyB]
            }

            const continuationIds = Array.from(new Set(
              continuationSources.flatMap((source) => [
                ...(source.trackingContinuationIds ?? []),
                source.id,
              ]),
            ))

            return stepped.map((body) => (
              body === remnant
                ? { ...body, trackingContinuationIds: continuationIds }
                : body
            ))
          }
          '''
          text = text[:start] + new_function + text[end:]
          write(path, text)

          # Update type documentation to match the explicit continuation policy.
          replace_once(
              'src/types.ts',
              '''  /**\n   * Source body ids whose ordinary camera tracking may continue onto this body.\n   * This is intentionally narrower than collision lineage: only the strictly\n   * larger body in an `absorb` collision contributes continuity ids.\n   */''',
              '''  /**\n   * Source body ids whose ordinary camera tracking may continue onto this body.\n   * This is intentionally narrower than generic collision lineage: absorption\n   * carries only the dominant absorber, while a true merge may carry both merged\n   * physical source lineages. The captured initial-mass gate still applies.\n   */''',
          )

          # Renderer: keep detached historical trails alive until their normal
          # trail-duration expiry instead of deleting them with the body mesh.
          path = 'src/rendering/simulationRenderer.ts'
          text = read(path)
          old_options = '''export type SimulationRendererOptions = {\n  onCameraTelemetry?: (telemetry: SimulationCameraTelemetry) => void\n}\n'''
          new_options = '''export type SimulationTrailTelemetry = {\n  retainedTrailIds: string[]\n}\n\nexport type SimulationRendererOptions = {\n  onCameraTelemetry?: (telemetry: SimulationCameraTelemetry) => void\n  onTrailTelemetry?: (telemetry: SimulationTrailTelemetry) => void\n}\n'''
          if text.count(old_options) != 1:
              raise SystemExit('simulationRenderer options block mismatch')
          text = text.replace(old_options, new_options, 1)

          old_removal = '''    Array.from(visuals.entries()).forEach(([id]) => {\n      if (currentIds.has(id)) return\n      removeVisual(id)\n    })\n'''
          new_removal = '''    const retainedTrailIds: string[] = []\n    Array.from(visuals.entries()).forEach(([id, visual]) => {\n      if (currentIds.has(id)) return\n\n      visual.mesh.visible = false\n      visual.glowInner.visible = false\n      visual.glowOuter.visible = false\n      while (visual.points.length > 0 && visual.points[0].capturedAt < cutoff) visual.points.shift()\n\n      if (trailEnabledNow && visual.points.length > 0) {\n        retainedTrailIds.push(id)\n        updateTrailVisual(\n          visual,\n          simulationTimeNow,\n          trailDurationNow,\n          true,\n        )\n        return\n      }\n\n      removeVisual(id)\n    })\n'''
          if text.count(old_removal) != 1:
              raise SystemExit('simulationRenderer removal block mismatch')
          text = text.replace(old_removal, new_removal, 1)
          needle = '''    })\n\n    controls.update()\n    emitCameraTelemetry(\n      state,\n'''
          replacement = '''    })\n\n    options.onTrailTelemetry?.({ retainedTrailIds: [...retainedTrailIds] })\n    controls.update()\n    emitCameraTelemetry(\n      state,\n'''
          if text.count(needle) != 1:
              raise SystemExit(f'simulationRenderer telemetry insertion mismatch: {text.count(needle)}')
          text = text.replace(needle, replacement, 1)
          write(path, text)

          # Real-physics regression for equal-mass merge tracking continuity.
          path = 'scripts/trackingRegression.ts'
          text = read(path)
          insert_before = 'function testDestroyedBodyNeverFallsBackToFragments() {'
          test_fn = '''function testEqualMassMergeGetsExplicitPhysicsContinuation() {\n  const atlas = makeBody('Atlas', 'planet', 0.4013, 0.0754)\n  const selene = makeBody('Selene', 'planet', 0.4013, 0.0754)\n  atlas.position = { x: -0.073, y: 0, z: 0 }\n  selene.position = { x: 0.073, y: 0, z: 0 }\n\n  let after: BodyState[] = [atlas, selene]\n  for (let step = 0; step < 24; step += 1) {\n    after = stepBodies(after, 0.0015)\n  }\n\n  const remnant = after.find((body) =>\n    body.bodyType !== 'effect' &&\n    body.bodyType !== 'fragment' &&\n    body.id.includes('Atlas') &&\n    body.id.includes('Selene'),\n  )\n\n  assert(remnant, 'equal-mass planet merge must produce one physical remnant')\n  assert(\n    remnant.trackingContinuationIds?.includes('Atlas') === true &&\n      remnant.trackingContinuationIds?.includes('Selene') === true,\n    'a true equal-mass merge must explicitly continue both merged source ids',\n  )\n  assert(\n    findTrackingCandidate(after, 'Atlas')?.id === remnant.id,\n    'Atlas tracking must resolve to the equal-mass merge remnant',\n  )\n  assert(\n    findTrackingCandidate(after, 'Selene')?.id === remnant.id,\n    'Selene tracking must resolve to the equal-mass merge remnant',\n  )\n  assert(\n    isTrackingMassEligible(remnant.mass, atlas.mass) &&\n      isTrackingMassEligible(remnant.mass, selene.mass),\n    'the equal-mass merge continuation must remain subject to and pass the existing 50% initial-mass gate',\n  )\n}\n\n'''
          if text.count(insert_before) != 1:
              raise SystemExit('tracking regression insertion point mismatch')
          text = text.replace(insert_before, test_fn + insert_before, 1)
          list_needle = '  testOnlyLargerAbsorberGetsPhysicsContinuation,\n  testDestroyedBodyNeverFallsBackToFragments,'
          list_replacement = '  testOnlyLargerAbsorberGetsPhysicsContinuation,\n  testEqualMassMergeGetsExplicitPhysicsContinuation,\n  testDestroyedBodyNeverFallsBackToFragments,'
          if text.count(list_needle) != 1:
              raise SystemExit('tracking regression list mismatch')
          text = text.replace(list_needle, list_replacement, 1)
          write(path, text)

          # Extend the existing real renderer handoff harness with trail history.
          path = 'src/visualRegression/TrackingCameraHandoffVisualHarness.tsx'
          text = read(path)
          insert_marker = 'function makeState(stage: HandoffStage): SimulationRenderState {'
          trail_helper = '''function makeTrailBatch(stage: HandoffStage): SimulationRenderState['trailSampleBatch'] {\n  if (stage === 'tracking') return { sequence: 0, samples: [] }\n  if (stage === 'collision') {\n    return {\n      sequence: 1,\n      samples: [\n        { bodyId: sourceA.id, color: sourceA.color, position: { x: -0.9, y: -0.08, z: 0 }, simulatedAt: 0.1 },\n        { bodyId: sourceA.id, color: sourceA.color, position: { x: -0.6, y: -0.05, z: 0 }, simulatedAt: 0.2 },\n        { bodyId: sourceA.id, color: sourceA.color, position: { x: -0.3, y: -0.02, z: 0 }, simulatedAt: 0.3 },\n        { bodyId: sourceB.id, color: sourceB.color, position: { x: 1.1, y: 0.28, z: 0 }, simulatedAt: 0.1 },\n        { bodyId: sourceB.id, color: sourceB.color, position: { x: 0.9, y: 0.22, z: 0 }, simulatedAt: 0.2 },\n        { bodyId: sourceB.id, color: sourceB.color, position: { x: 0.7, y: 0.16, z: 0 }, simulatedAt: 0.3 },\n      ],\n    }\n  }\n  return {\n    sequence: 2,\n    samples: [\n      { bodyId: remnant.id, color: remnant.color, position: { ...remnant.position }, simulatedAt: 1 },\n    ],\n  }\n}\n\n'''
          if text.count(insert_marker) != 1:
              raise SystemExit('handoff harness makeState marker mismatch')
          text = text.replace(insert_marker, trail_helper + insert_marker, 1)
          text = text.replace('    trailEnabled: false,\n    trailDuration: 8,\n    trailSampleBatch: { sequence: 0, samples: [] },', '    trailEnabled: true,\n    trailDuration: 8,\n    trailSampleBatch: makeTrailBatch(stage),', 1)
          global_needle = '    __trackingCameraHandoffSamples?: TimedCameraTelemetry[]\n'
          if text.count(global_needle) != 1:
              raise SystemExit('handoff harness global marker mismatch')
          text = text.replace(global_needle, global_needle + '    __trackingCameraHandoffRetainedTrailIds?: string[]\n', 1)
          callback_needle = '''        onCameraTelemetry: (telemetry) => {\n          window.__trackingCameraHandoffTelemetry = telemetry\n          if (releaseArmed && telemetry.collisionCameraJustReleased) {\n            releaseStartedAt = telemetry.nowMs\n            releaseArmed = false\n            releaseSamples.length = 0\n          }\n          if (releaseStartedAt !== null) {\n            releaseSamples.push({\n              ...telemetry,\n              elapsedMs: telemetry.nowMs - releaseStartedAt,\n            })\n            if (releaseSamples.length > 180) releaseSamples.shift()\n            window.__trackingCameraHandoffSamples = [...releaseSamples]\n          }\n        },\n'''
          callback_replacement = callback_needle + '''        onTrailTelemetry: (telemetry) => {\n          window.__trackingCameraHandoffRetainedTrailIds = [...telemetry.retainedTrailIds]\n        },\n'''
          if text.count(callback_needle) != 1:
              raise SystemExit('handoff harness callback mismatch')
          text = text.replace(callback_needle, callback_replacement, 1)
          cleanup_needle = '      delete window.__trackingCameraHandoffSamples\n'
          if text.count(cleanup_needle) != 1:
              raise SystemExit('handoff harness cleanup marker mismatch')
          text = text.replace(cleanup_needle, cleanup_needle + '      delete window.__trackingCameraHandoffRetainedTrailIds\n', 1)
          write(path, text)

          # Browser regression must prove both incoming trails survive body-id removal.
          path = 'scripts/collisionCameraTrackingHandoffVisualRegression.py'
          text = read(path)
          probe_needle = '''        samples = driver.execute_script('return window.__trackingCameraHandoffSamples')\n        require(isinstance(samples, list) and len(samples) >= 4, 'release telemetry must contain multiple renderer frames')\n\n'''
          probe_replacement = probe_needle + '''        retained_trail_ids = driver.execute_script(\n            'return window.__trackingCameraHandoffRetainedTrailIds || []'\n        )\n        require(\n            'handoff-a' in retained_trail_ids and 'handoff-b' in retained_trail_ids,\n            f'collision source trails must remain after merge body-id replacement: {retained_trail_ids}',\n        )\n        payload['retained_trail_ids'] = retained_trail_ids\n\n'''
          if text.count(probe_needle) != 1:
              raise SystemExit('handoff visual regression insertion mismatch')
          text = text.replace(probe_needle, probe_replacement, 1)
          write(path, text)
          PY

      - name: Install dependencies
        run: npm install
      - name: Core regression gate
        run: |
          npm run check:version
          npm run check:physics
          npx tsc -b
          npx vite build
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "stafor94"
          git config user.email "stafor@naver.com"
          git add package.json CHANGELOG.md \
            src/types.ts \
            src/physics/fragmentAwareEngine.ts \
            src/rendering/simulationRenderer.ts \
            src/visualRegression/TrackingCameraHandoffVisualHarness.tsx \
            scripts/trackingRegression.ts \
            scripts/collisionCameraTrackingHandoffVisualRegression.py
          git diff --cached --check
          git commit -m "fix: preserve merge tracking and trail continuity"
          git push origin HEAD:fix/merge-tracking-trail-continuity-v0.19.6
