name: Apply v0.19.6 merge tracking and trail patch

on:
  push:
    branches:
      - fix/merge-tracking-trail-continuity-v0.19.6

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/merge-tracking-trail-continuity-v0.19.6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply focused patch
        run: python scripts/_patch_v0196_merge_tracking_trail.py
      - name: Install dependencies
        run: npm install
      - name: Core regression gate
        run: |
          npm run check:version
          npm run check:physics
          npx tsc -b
          npx vite build
      - name: Commit product changes
        run: |
          git config user.name "stafor94"
          git config user.email "stafor@naver.com"
          git add package.json CHANGELOG.md \
            src/types.ts \
            src/physics/fragmentAwareEngine.ts \
            src/rendering/simulationRenderer.ts \
            src/visualRegression/TrackingCameraHandoffVisualHarness.tsx \
            scripts/trackingRegression.ts \
            scripts/collisionCameraTrackingHandoffVisualRegression.py
          git diff --cached --check
          git commit -m "fix: preserve merge tracking and trail continuity"
          git push origin HEAD:fix/merge-tracking-trail-continuity-v0.19.6
