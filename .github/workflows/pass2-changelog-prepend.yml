name: Apply Pass 2 changelog

on:
  push:
    branches:
      - feat/stellar-photosphere-cellular-granulation
    paths:
      - '.github/workflows/pass2-changelog-prepend.yml'
      - 'scripts/prependPass2Changelog.mjs'

permissions:
  contents: write

jobs:
  prepend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/stellar-photosphere-cellular-granulation
      - name: Prepend release entry
        run: node scripts/prependPass2Changelog.mjs
      - name: Commit changelog
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md
          git commit -m "docs: record cellular stellar photosphere"
          git push origin HEAD:feat/stellar-photosphere-cellular-granulation
