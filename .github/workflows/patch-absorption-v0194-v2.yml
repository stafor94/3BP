name: Patch absorption continuity v0.19.4 v2

on:
  push:
    branches:
      - fix/absorption-pop-continuity-v0.19.4

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[absorption-patched]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/absorption-pop-continuity-v0.19.4
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply absorption continuity fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          engine_path = Path('src/physics/fragmentAwareEngine.ts')
          engine = engine_path.read_text()

          engine = replace_once(
              engine,
              "const EXTREME_MASS_RATIO_ABSORPTION_MAX_SPEED_RATIO = 1.05\n",
              "const EXTREME_MASS_RATIO_ABSORPTION_MAX_SPEED_RATIO = 1.05\n"
              "const ABSORPTION_SINK_START_PROGRESS = 0.18\n"
              "const ABSORPTION_COLLAPSE_START_PROGRESS = 0.32\n"
              "const ABSORPTION_SINK_FRACTION = 0.44\n"
              "const ABSORPTION_MIN_RADIUS_SCALE = 0.06\n"
              "const ABSORPTION_EJECTA_LIFETIME = 0.55\n",
              'absorption constants',
          )

          engine = replace_once(
              engine,
              "      if (body.bodyType === 'effect' && body.name === COLLISION_SPARK_NAME) {\n"
              "        return {\n"
              "          ...body,\n"
              "          lifetime: 0.9,\n"
              "        }\n"
              "      }\n",
              "      if (body.bodyType === 'effect' && body.name === COLLISION_SPARK_NAME) {\n"
              "        return {\n"
              "          ...body,\n"
              "          lifetime: Math.min(body.lifetime ?? 0.9, 0.9),\n"
              "        }\n"
              "      }\n",
              'spark lifetime preservation',
          )

          engine = replace_once(
              engine,
              "function advancePhysicalBodies(input: BodyState[], dt: number) {\n"
              "  const stepped = stepPhysicsBodies(input, dt)\n"
              "  const withMassCorrection = normalizeExtremeMassRatioAbsorption(input, stepped, dt)\n"
              "  const withTrackingContinuity = attachAbsorptionTrackingContinuity(input, withMassCorrection, dt)\n"
              "  return finalizePhysicalBodies(input, withTrackingContinuity, dt)\n"
              "}\n",
              "function advancePhysicalBodies(input: BodyState[], dt: number) {\n"
              "  const stepped = stepPhysicsBodies(input, dt)\n"
              "  const withLocalizedAbsorptionEjecta = localizeExtremeAbsorptionEjecta(input, stepped, dt)\n"
              "  const withMassCorrection = normalizeExtremeMassRatioAbsorption(\n"
              "    input,\n"
              "    withLocalizedAbsorptionEjecta,\n"
              "    dt,\n"
              "  )\n"
              "  const withTrackingContinuity = attachAbsorptionTrackingContinuity(input, withMassCorrection, dt)\n"
              "  return finalizePhysicalBodies(input, withTrackingContinuity, dt)\n"
              "}\n",
              'physical absorption pipeline',
          )

          helper_marker = "function attachAbsorptionTrackingContinuity(\n"
          helper = r'''function normalizeDirection(value: Vec3, fallback: Vec3): Vec3 {
            const length = Math.hypot(value.x, value.y, value.z)
            if (length > 1e-10) {
              return { x: value.x / length, y: value.y / length, z: value.z / length }
            }
            const fallbackLength = Math.hypot(fallback.x, fallback.y, fallback.z)
            if (fallbackLength > 1e-10) {
              return {
                x: fallback.x / fallbackLength,
                y: fallback.y / fallbackLength,
                z: fallback.z / fallbackLength,
              }
            }
            return { x: 1, y: 0, z: 0 }
          }

          function localizeExtremeAbsorptionEjecta(
            input: BodyState[],
            stepped: BodyState[],
            dt: number,
          ): BodyState[] {
            const collisionPair = findNewCollisionPair(input, stepped, dt)
            if (!collisionPair) return stepped

            const { bodyA, bodyB } = collisionPair
            const mode = inferCollisionPresentationMode(stepped, bodyA, bodyB)
            if (mode !== 'merge') return stepped
            if (
              getEffectiveBodyType(bodyA) === 'star' ||
              getEffectiveBodyType(bodyB) === 'star'
            ) return stepped

            const geometry = getTrackingCollisionGeometry(bodyA, bodyB)
            if (!isExtremeMassRatioLowEnergyAbsorption(bodyA, bodyB, geometry)) return stepped

            const remnant = stepped.find((body) =>
              body.bodyType !== 'effect' &&
              body.bodyType !== 'fragment' &&
              body.id !== bodyA.id &&
              body.id !== bodyB.id &&
              isBodyDescendedFrom(body.id, bodyA.id) &&
              isBodyDescendedFrom(body.id, bodyB.id),
            )
            if (!remnant) return stepped

            const delta = {
              x: bodyB.position.x - bodyA.position.x,
              y: bodyB.position.y - bodyA.position.y,
              z: bodyB.position.z - bodyA.position.z,
            }
            const relativeVelocity = {
              x: bodyB.velocity.x - bodyA.velocity.x,
              y: bodyB.velocity.y - bodyA.velocity.y,
              z: bodyB.velocity.z - bodyA.velocity.z,
            }
            const normal = normalizeDirection(delta, relativeVelocity)
            const surfaceA = {
              x: bodyA.position.x + normal.x * bodyA.radius,
              y: bodyA.position.y + normal.y * bodyA.radius,
              z: bodyA.position.z + normal.z * bodyA.radius,
            }
            const surfaceB = {
              x: bodyB.position.x - normal.x * bodyB.radius,
              y: bodyB.position.y - normal.y * bodyB.radius,
              z: bodyB.position.z - normal.z * bodyB.radius,
            }
            const contactPoint = {
              x: (surfaceA.x + surfaceB.x) * 0.5,
              y: (surfaceA.y + surfaceB.y) * 0.5,
              z: (surfaceA.z + surfaceB.z) * 0.5,
            }
            const totalMass = Math.max(bodyA.mass + bodyB.mass, 1e-9)
            const centerPosition = {
              x: (bodyA.position.x * bodyA.mass + bodyB.position.x * bodyB.mass) / totalMass,
              y: (bodyA.position.y * bodyA.mass + bodyB.position.y * bodyB.mass) / totalMass,
              z: (bodyA.position.z * bodyA.mass + bodyB.position.z * bodyB.mass) / totalMass,
            }
            const centerVelocity = getCenterVelocity(bodyA, bodyB)
            const minRadius = Math.max(Math.min(bodyA.radius, bodyB.radius), 1e-6)

            return stepped.map((body) => {
              const isEjecta = body !== remnant &&
                body.mass > 0 &&
                (body.bodyType === 'fragment' || body.bodyType === 'effect') &&
                isBodyDescendedFrom(body.id, bodyA.id) &&
                isBodyDescendedFrom(body.id, bodyB.id)
              if (!isEjecta) return body

              const displacement = {
                x: body.position.x - centerPosition.x,
                y: body.position.y - centerPosition.y,
                z: body.position.z - centerPosition.z,
              }
              const velocityDelta = {
                x: body.velocity.x - centerVelocity.x,
                y: body.velocity.y - centerVelocity.y,
                z: body.velocity.z - centerVelocity.z,
              }
              const direction = normalizeDirection(displacement, velocityDelta)
              const radiusFraction = Math.min(1, Math.max(0, body.radius / minRadius))
              const spawnOffset = minRadius * (0.055 + radiusFraction * 0.025)

              return {
                ...body,
                name: COLLISION_SPARK_NAME,
                bodyType: 'effect' as const,
                position: {
                  x: contactPoint.x + direction.x * spawnOffset,
                  y: contactPoint.y + direction.y * spawnOffset,
                  z: contactPoint.z + direction.z * spawnOffset,
                },
                age: 0,
                lifetime: ABSORPTION_EJECTA_LIFETIME,
                effectVisual: {
                  ...(body.effectVisual ?? {}),
                  kind: 'collisionSpark',
                  direction: { ...direction },
                  normal: { ...normal },
                  stretch: 1.1,
                  widthScale: 0.82,
                  tailLength: 0.08,
                  brightness: 0.58,
                  turbulence: 0.08,
                  pulseStrength: 0.01,
                },
              }
            })
          }

          '''
          if helper_marker not in engine:
              raise SystemExit('absorption helper insertion marker missing')
          engine = engine.replace(helper_marker, helper + helper_marker, 1)

          animate_marker = "function getTransitionBodies(transition: CollisionTransition) {\n"
          animate_helper = r'''function animateAbsorbedCollider(
            body: BodyState,
            impactPosition: Vec3,
            absorberImpactPosition: Vec3,
            progress: number,
          ) {
            const sinkProgress = smoothstep01(
              (progress - ABSORPTION_SINK_START_PROGRESS) /
                Math.max(1e-6, 1 - ABSORPTION_SINK_START_PROGRESS),
            )
            const collapseProgress = smoothstep01(
              (progress - ABSORPTION_COLLAPSE_START_PROGRESS) /
                Math.max(1e-6, 1 - ABSORPTION_COLLAPSE_START_PROGRESS),
            )
            const position = {
              x: impactPosition.x +
                (absorberImpactPosition.x - impactPosition.x) * sinkProgress * ABSORPTION_SINK_FRACTION,
              y: impactPosition.y +
                (absorberImpactPosition.y - impactPosition.y) * sinkProgress * ABSORPTION_SINK_FRACTION,
              z: impactPosition.z +
                (absorberImpactPosition.z - impactPosition.z) * sinkProgress * ABSORPTION_SINK_FRACTION,
            }
            const radiusScale = Math.max(
              ABSORPTION_MIN_RADIUS_SCALE,
              1 - collapseProgress * (1 - ABSORPTION_MIN_RADIUS_SCALE),
            )

            return {
              ...animateCollider(body, position),
              radius: body.radius * radiusScale,
            }
          }

          '''
          if animate_marker not in engine:
              raise SystemExit('absorbed collider insertion marker missing')
          engine = engine.replace(animate_marker, animate_helper + animate_marker, 1)

          function_start = engine.index('function buildCollisionImpactFrame(transition: CollisionTransition) {')
          map_start = engine.index('  return transition.sourceBodies\n', function_start)
          map_end = engine.index('\n}\n\nfunction buildContactPhysicalFrame', map_start)
          new_map = r'''  const nonStellarAbsorption =
            isAbsorptionCollision(pair.bodyA, pair.bodyB, transition.mode) &&
            getEffectiveBodyType(pair.bodyA) !== 'star' &&
            getEffectiveBodyType(pair.bodyB) !== 'star'
          const absorbedId = nonStellarAbsorption
            ? pair.bodyA.mass < pair.bodyB.mass
              ? pair.bodyA.id
              : pair.bodyB.mass < pair.bodyA.mass
                ? pair.bodyB.id
                : null
            : null
          const absorberImpactPosition = absorbedId === pair.bodyA.id
            ? impactPositions.bodyB
            : impactPositions.bodyA

          return transition.sourceBodies
            .map((body) => {
              if (body.id === pair.bodyA.id) {
                return body.id === absorbedId
                  ? animateAbsorbedCollider(
                      body,
                      impactPositions.bodyA,
                      absorberImpactPosition,
                      progress,
                    )
                  : animateCollider(body, impactPositions.bodyA)
              }
              if (body.id === pair.bodyB.id) {
                return body.id === absorbedId
                  ? animateAbsorbedCollider(
                      body,
                      impactPositions.bodyB,
                      absorberImpactPosition,
                      progress,
                    )
                  : animateCollider(body, impactPositions.bodyB)
              }
              return advanceDisplayBody(body, transition.elapsed)
            })
            .filter((body) => !isExpiredEffect(body))
          '''
          engine = engine[:map_start] + new_map + engine[map_end:]
          engine_path.write_text(engine)

          regression_path = Path('scripts/nonStellarRegression.ts')
          regression = regression_path.read_text()
          start = regression.index('function testTinySubEscapeMoonGrazeUsesImpactorScaledMassLoss() {')
          end = regression.index('\nconst tests = [', start)
          replacement = r'''function testTinySubEscapeMoonGrazeUsesImpactorScaledMassLoss() {
            // Reproduce the observed Janus/Luna scale: a 0.0019 moon grazing a 0.35
            // planet at relative speed 2.412, about 0.85x their mutual escape speed.
            const janus: BodyState = {
              id: 'janus',
              name: 'Janus',
              color: '#647f95',
              mass: 0.35,
              radius: 0.0688,
              position: { x: 0, y: 0, z: 0 },
              velocity: { x: 0, y: 0, z: 0 },
              bodyType: 'planet',
            }
            const luna: BodyState = {
              id: 'luna',
              name: 'Luna',
              color: '#aaa49a',
              mass: 0.0019,
              radius: 0.0187,
              position: { x: janus.radius + 0.0187 - 1e-6, y: 0, z: 0 },
              velocity: { x: -0.21708, y: 2.4022115380623745, z: 0 },
              bodyType: 'moon',
            }
            const initialMass = janus.mass + luna.mass
            const initialDelta = {
              x: luna.position.x - janus.position.x,
              y: luna.position.y - janus.position.y,
              z: luna.position.z - janus.position.z,
            }
            const initialDistance = Math.hypot(initialDelta.x, initialDelta.y, initialDelta.z)
            const initialNormal = {
              x: initialDelta.x / initialDistance,
              y: initialDelta.y / initialDistance,
              z: initialDelta.z / initialDistance,
            }
            const contactPoint = {
              x: (
                janus.position.x + initialNormal.x * janus.radius +
                luna.position.x - initialNormal.x * luna.radius
              ) * 0.5,
              y: (
                janus.position.y + initialNormal.y * janus.radius +
                luna.position.y - initialNormal.y * luna.radius
              ) * 0.5,
              z: (
                janus.position.z + initialNormal.z * janus.radius +
                luna.position.z - initialNormal.z * luna.radius
              ) * 0.5,
            }

            let resolved: BodyState[] = [janus, luna]
            let observedAbsorptionShrink = false
            let firstResolvedFrame: BodyState[] | null = null
            for (let step = 0; step < 24; step += 1) {
              resolved = stepFragmentAwareBodies(resolved, 0.0015)
              const liveImpactor = resolved.find((body) => body.id === luna.id)
              if (liveImpactor && liveImpactor.radius <= luna.radius * 0.82) {
                observedAbsorptionShrink = true
              }
              const remnantNow = resolved.find((body) =>
                body.bodyType === 'planet' && body.id.includes(janus.id) && body.id.includes(luna.id),
              )
              if (remnantNow && !firstResolvedFrame) {
                firstResolvedFrame = resolved.map((body) => ({
                  ...body,
                  position: { ...body.position },
                  velocity: { ...body.velocity },
                  effectVisual: body.effectVisual
                    ? {
                        ...body.effectVisual,
                        direction: { ...body.effectVisual.direction },
                        normal: body.effectVisual.normal ? { ...body.effectVisual.normal } : undefined,
                      }
                    : undefined,
                }))
              }
            }
            const remnant = resolved.find((body) =>
              body.bodyType === 'planet' && body.id.includes(janus.id) && body.id.includes(luna.id),
            )

            assert(
              observedAbsorptionShrink,
              'tiny absorbed impactor should visibly shrink before the physical replacement frame',
            )
            assert(remnant, 'tiny sub-escape moon graze should resolve to one planet remnant after the contact presentation bridge')
            assert(firstResolvedFrame, 'tiny absorption regression must capture the first physical result frame')
            const firstRemnant = firstResolvedFrame.find((body) =>
              body.bodyType === 'planet' && body.id.includes(janus.id) && body.id.includes(luna.id),
            )
            assert(firstRemnant, 'first physical absorption frame must contain the planet remnant')
            const absorptionEjecta = firstResolvedFrame.filter((body) =>
              body !== firstRemnant &&
              body.mass > 0 &&
              body.id.includes(janus.id) &&
              body.id.includes(luna.id),
            )
            assert(absorptionEjecta.length > 0, 'tiny absorption should retain represented ejecta mass')
            absorptionEjecta.forEach((body) => {
              assert(
                body.bodyType === 'effect' && body.name === 'Collision spark',
                'tiny absorption ejecta must be transient compact effects instead of detached solid fragments',
              )
              assert(
                (body.lifetime ?? Number.POSITIVE_INFINITY) <= 0.56,
                'tiny absorption ejecta must fade quickly instead of lingering as late collision streaks',
              )
              assert(
                (body.effectVisual?.stretch ?? Number.POSITIVE_INFINITY) <= 1.11 &&
                  (body.effectVisual?.tailLength ?? Number.POSITIVE_INFINITY) <= 0.081,
                'tiny absorption ejecta must remain compact instead of rendering as long directional streaks',
              )
              const spawnDistance = Math.hypot(
                body.position.x - contactPoint.x,
                body.position.y - contactPoint.y,
                body.position.z - contactPoint.z,
              )
              assert(
                spawnDistance <= Math.max(janus.radius, luna.radius) * 0.22,
                'tiny absorption ejecta must originate at the contact patch instead of popping in away from the body',
              )
            })

            const escapedMass = initialMass - remnant.mass
            assert(
              escapedMass <= luna.mass * 0.35 + 1e-10,
              'tiny sub-escape graze must cap escaped mass to a fraction of the impactor mass',
            )
            assert(
              remnant.mass > janus.mass,
              'the primary should gain mass after absorbing most of a tiny sub-escape moon',
            )
            assertClose(
              totalMass(resolved),
              initialMass,
              1e-10,
              'corrected tiny-impact absorption must conserve total represented mass',
            )
            assert(
              findTrackingCandidate(resolved, janus.id)?.id === remnant.id,
              'the larger absorber should transfer ordinary tracking continuity to the remnant',
            )
          }
          '''
          regression = regression[:start] + replacement + regression[end:]
          regression_path.write_text(regression)

          package_path = Path('package.json')
          package = package_path.read_text()
          package = replace_once(package, '"version": "0.19.3"', '"version": "0.19.4"', 'package version')
          package_path.write_text(package)

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          marker = '## [0.19.3] - 2026-08-26\n'
          release = '''## [0.19.4] - 2026-08-27

          ### Changed
          - 극단적 질량비의 저에너지 비항성 흡수 충돌은 작은 피흡수체를 접촉 마지막 프레임까지 원래 크기로 유지하지 않고, 충돌 후반부에 흡수체 내부로 침강시키면서 반지름을 연속적으로 축소하도록 변경했습니다.
          - 같은 흡수 충돌에서 소량의 방출 질량은 멀리 떨어진 고체 파편으로 즉시 생성하지 않고 실제 접촉 패치에서 시작하는 짧고 컴팩트한 충돌 입자로 표현하도록 변경했습니다.

          ### Fixed
          - 작은 천체가 큰 천체와 충돌한 직후 한 프레임에서 갑자기 사라지는 현상을 수정했습니다.
          - 저에너지 흡수 직후 파편이 천체 위아래의 떨어진 위치에 완성된 상태로 갑자기 나타나는 현상을 수정했습니다.
          - 흡수 충돌에서 생성된 파편이 재충돌하며 뒤늦게 길쭉한 `Collision spark` 특수효과를 만들었다가 사라지는 현상을 제거하고, 해당 방출물을 0.55초 이내에 사라지는 접촉면 국소 효과로 제한했습니다.

          '''
          if marker not in changelog:
              raise SystemExit('CHANGELOG insertion marker missing')
          changelog = changelog.replace(marker, release + marker, 1)
          changelog_path.write_text(changelog)

          for temp_workflow in [
              Path('.github/workflows/patch-absorption-v0194.yml'),
              Path('.github/workflows/patch-absorption-v0194-v2.yml'),
          ]:
              if temp_workflow.exists():
                  temp_workflow.unlink()
          PY
      - name: Install dependencies
        run: npm install
      - name: Validate patched release
        run: npm run build
      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "stafor94"
          git config user.email "stafor@naver.com"
          git add -A
          git commit -m "v0.19.4: smooth absorption collision handoff [absorption-patched]"
          git push origin HEAD:fix/absorption-pop-continuity-v0.19.4
