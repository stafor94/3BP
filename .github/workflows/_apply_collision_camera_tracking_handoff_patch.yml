name: Apply collision camera tracking handoff patch

on:
  push:
    branches:
      - fix/collision-camera-tracking-handoff-v0.19.5

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/collision-camera-tracking-handoff-v0.19.5
          fetch-depth: 0
      - name: Repair generated Python delimiter
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_apply_collision_camera_tracking_handoff_patch.py')
          text = path.read_text(encoding='utf-8')
          old_open = "                '''\n                const samples = window.__trackingCameraHandoffSamples || [];"
          new_open = '                """\n                const samples = window.__trackingCameraHandoffSamples || [];'
          old_close = "                return samples.length > 0 && samples[samples.length - 1].elapsedMs >= 650;\n                '''\n            )"
          new_close = '                return samples.length > 0 && samples[samples.length - 1].elapsedMs >= 650;\n                """\n            )'
          if old_open not in text or old_close not in text:
              raise RuntimeError('generated browser regression script marker not found')
          text = text.replace(old_open, new_open, 1).replace(old_close, new_close, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate patch script
        run: python -m py_compile scripts/_apply_collision_camera_tracking_handoff_patch.py
      - name: Apply patch
        run: python scripts/_apply_collision_camera_tracking_handoff_patch.py
      - name: Commit release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v0.19.5: restore tracking after collision camera"
          git push origin HEAD:fix/collision-camera-tracking-handoff-v0.19.5
