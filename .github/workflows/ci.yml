name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Versioning regression
        run: npm run check:version
      - name: Physics regression
        run: npm run check:physics
      - name: TypeScript compile
        run: npx tsc -b
      - name: Vite build
        run: npx vite build
      - name: Install browser visual regression runtime
        run: python -m pip install --disable-pip-version-check --quiet selenium==4.35.0 pillow==11.3.0
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/3bp-preview.log 2>&1 &
          echo $! > /tmp/3bp-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/3BP/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/3bp-preview.log
          exit 1
      - name: Stellar collision browser visual regression
        run: python scripts/visualStellarCollisionRegression.py
      - name: Strict stellar collision visual gate
        run: python scripts/strictStellarCollisionVisualGate.py
      - name: Collision watch browser visual regression
        run: python scripts/collisionWatchVisualRegression.py
      - name: Non-stellar destruction browser visual regression
        run: python scripts/nonStellarDestructionVisualRegression.py
      - name: Survivor absorption browser visual regression
        run: python scripts/survivorAbsorptionVisualRegression.py
      - name: Actual disruption browser visual regression
        run: python scripts/actualDisruptionVisualRegression.py
      - name: Upload stellar collision visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellar-collision-visual-regression
          path: visual-regression-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload collision watch visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collision-watch-visual-regression
          path: collision-watch-visual-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload non-stellar destruction visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: non-stellar-destruction-visual-regression
          path: non-stellar-destruction-visual-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload survivor absorption visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survivor-absorption-visual-regression
          path: survivor-absorption-visual-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload actual disruption visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-disruption-visual-regression
          path: actual-disruption-visual-artifacts
          if-no-files-found: warn
          retention-days: 7
