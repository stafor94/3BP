name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: One-time prepend v0.24.12 changelog entry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          version = '## [0.24.12] - 2026-09-03'
          if version not in text:
              anchor = '## [0.24.11] - 2026-09-03'
              if anchor not in text:
                  raise SystemExit('expected v0.24.11 changelog anchor not found')
              section = '''## [0.24.12] - 2026-09-03

### Fixed
- 확대된 항성 photosphere를 거대한 Voronoi/벌집/거북이 등껍질/얼음 균열처럼 보이게 하던 F1/F2 cellular distance field와 `F2 - F1` 기반 intergranular dark-lane network를 production stellar shader에서 제거했습니다.

### Changed
- 임시 Pass 1 photosphere 기반을 저주파의 넓고 부드러운 convection brightness variation, 서로 decorrelate된 약한 중간 scale irregular breakup, 매우 약한 fine breakup으로 재구성했습니다. 각 신호는 낮은 contrast로 제한하고 닫힌 polygon cell topology를 생성하지 않습니다.
- 시간 변화는 texture 좌표를 이동·회전시키지 않고 broad/mid-scale 진폭의 매우 느린 breathing에만 사용하며, 기존 screen-space derivative LOD는 새 비-cellular surface scale에 맞춰 최소한으로 유지합니다.
- cellular topology 자체를 요구하던 structural/visual regression을 제거하고, stellar 전용 render path·non-stellar shader isolation·procedural surface variation·평균 luminance/footprint·temperature hue·zoom 안정성을 검증하는 결과 기반 contract로 교체했습니다.

### Verification
- production mobile 390×844 deterministic temperature fixture에서 0.35 / 1 / 8 M☉ 항성을 normal/enlarged로 즉시 이전 main(`0915389`)과 A/B 비교하고, luminance·bright footprint·temperature hue·broad variation·local inhomogeneity 유지와 lane-like local minima 감소를 검증합니다.
- 확대/일반/축소 screen-space surface LOD와 연속 zoom sweep에서 broad structure 유지, unresolved high-frequency spike 억제 및 photosphere footprint 안정성을 검증합니다.

### Unchanged
- `starColors.ts`의 temperature 기반 항성 색 정책, stellar mass/radius, preset/evolution physics, orbit/velocity/timestep, collision 판정·결과, planet/moon/fragment rendering, Pass 4 limb/edge, Pass 5 compact corona, Pass 6 HDR/global ACES tone mapping은 변경하지 않습니다.

'''
              path.write_text(text.replace(anchor, section + anchor, 1), encoding='utf-8')
          PY
          if ! git diff --quiet -- CHANGELOG.md; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add CHANGELOG.md
            git commit -m "docs: record stellar photosphere pass 1"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Versioning regression
        run: npm run check:version
      - name: Physics regression
        run: npm run check:physics
      - name: Full build
        run: npm run build
      - name: Install browser visual regression runtime
        run: python -m pip install --disable-pip-version-check --quiet selenium==4.35.0 pillow==11.3.0
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/3bp-preview.log 2>&1 &
          echo $! > /tmp/3bp-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/3BP/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/3bp-preview.log
          exit 1
      - name: Stellar collision browser visual regression
        run: python scripts/visualStellarCollisionRegression.py
      - name: Strict stellar collision visual gate
        run: python scripts/strictStellarCollisionVisualGate.py
      - name: Collision watch browser visual regression
        run: python scripts/collisionWatchVisualRegression.py
      - name: Collision camera tracking handoff browser regression
        run: python scripts/collisionCameraTrackingHandoffVisualRegression.py
      - name: Production camera handoff browser regression
        run: python scripts/productionCameraHandoffVisualRegression.py
      - name: Collision camera retained tracking without prior selection
        run: python scripts/collisionCameraRetainedTrackingVisualRegression.py
      - name: Production camera handoff desktop 1x regression
        env:
          PRODUCTION_CAMERA_HANDOFF_OUTPUT_DIR: production-camera-handoff-desktop-artifacts
          PRODUCTION_CAMERA_HANDOFF_SPEED: '1'
          PRODUCTION_CAMERA_VIEWPORT_WIDTH: '1024'
          PRODUCTION_CAMERA_VIEWPORT_HEIGHT: '768'
        run: python scripts/productionCameraHandoffVisualRegression.py
      - name: Non-stellar destruction browser visual regression
        run: python scripts/nonStellarDestructionVisualRegression.py
      - name: Collision ejecta Stage2/Stage3 browser A/B regression
        run: python scripts/collisionEjectaVisualRegression.py
      - name: Collision survivor Stage3/Stage4 browser A/B regression
        run: python scripts/collisionSurvivorResponseVisualRegression.py
      - name: Small head-on collision artifact browser visual regression
        run: python scripts/smallHeadOnCollisionArtifactVisualRegression.py
      - name: Collision merge solid handoff browser visual regression
        run: python scripts/collisionMergeHandoffVisualRegression.py
      - name: Survivor absorption browser visual regression
        run: python scripts/survivorAbsorptionVisualRegression.py
      - name: Absorption continuity browser visual regression
        run: python scripts/absorptionContinuityVisualRegression.py
      - name: Collision penetration browser A/B regression
        run: python scripts/collisionPenetrationVisualRegression.py
      - name: Actual disruption browser visual regression
        run: python scripts/actualDisruptionVisualRegression.py
      - name: Collision frame continuity browser visual regression
        run: python scripts/collisionContinuityVisualRegression.py
      - name: Mobile actual disruption browser visual regression
        run: python scripts/mobileDisruptionVisualRegression.py
      - name: Mobile top overlay browser visual regression
        run: python scripts/mobileTopOverlayVisualRegression.py
      - name: Upload stellar collision visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellar-collision-visual-regression
          path: visual-regression-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload collision watch visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collision-watch-visual-regression
          path: collision-watch-visual-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload collision camera tracking handoff captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collision-camera-tracking-handoff-regression
          path: collision-camera-tracking-handoff-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload production camera handoff captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-camera-handoff-regression
          path: production-camera-handoff-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload collision camera retained tracking captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collision-camera-retained-tracking-regression
          path: collision-camera-retained-tracking-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload production camera handoff desktop captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-camera-handoff-desktop-regression
          path: production-camera-handoff-desktop-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload non-stellar destruction visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: non-stellar-destruction-visual-regression
          path: non-stellar-destruction-visual-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload collision ejecta Stage2/Stage3 A/B captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collision-ejecta-stage3-visual-regression
          path: collision-ejecta-stage3-visual-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload collision survivor Stage3/Stage4 A/B captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collision-survivor-stage4-visual-regression
          path: collision-survivor-stage4-visual-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload small head-on collision artifact captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: small-head-on-collision-artifact-visual-regression
          path: small-head-on-collision-artifact-visual-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload collision merge handoff captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collision-merge-handoff-visual-regression
          path: collision-merge-handoff-visual-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload survivor absorption visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survivor-absorption-visual-regression
          path: survivor-absorption-visual-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload absorption continuity visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: absorption-continuity-visual-regression
          path: absorption-continuity-visual-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload collision penetration visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collision-penetration-visual-regression
          path: collision-penetration-visual-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload actual disruption visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-disruption-visual-regression
          path: actual-disruption-visual-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload collision frame continuity captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collision-frame-continuity-visual-regression
          path: collision-continuity-visual-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload mobile actual disruption visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
