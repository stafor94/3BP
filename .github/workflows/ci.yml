name: CI

on:
  push:
    branches: [fix/nonstellar-survivor-impact-v0.19.3]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply pending v0.19.3 fixes
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path

          lighting = Path('src/rendering/bodyLighting.ts')
          text = lighting.read_text(encoding='utf-8')
          text = text.replace(
              '  uniform float uSeed;\n  uniform float uDetailStrength;',
              '  uniform float uSeed;\n  uniform float uSurfaceSeed;\n  uniform float uDetailStrength;',
              1,
          )
          for old, new in [
              ('uSeed * 0.071', 'uSurfaceSeed * 0.071'),
              ('uSeed * 0.113', 'uSurfaceSeed * 0.113'),
              ('uSeed * 0.157', 'uSurfaceSeed * 0.157'),
              ('uSeed * 0.013', 'uSurfaceSeed * 0.013'),
              ('uSeed * 0.043', 'uSurfaceSeed * 0.043'),
              ('uSeed * 0.079', 'uSurfaceSeed * 0.079'),
              ('uSeed * 0.131', 'uSurfaceSeed * 0.131'),
              ('uSeed * 0.07', 'uSurfaceSeed * 0.07'),
          ]:
              text = text.replace(old, new)
          text = text.replace(
              '        ...values.uniforms,\n        uSecondaryColor:',
              '        ...values.uniforms,\n        uSurfaceSeed: { value: values.uniforms.uSeed.value },\n        uSecondaryColor:',
              1,
          )
          lighting.write_text(text, encoding='utf-8')

          bridge = Path('src/rendering/liveCollisionVfxBridge.ts')
          text = bridge.read_text(encoding='utf-8')
          text = text.replace(
              '  if (material.uniforms.uSeed) material.uniforms.uSeed.value = identitySeed',
              '  if (material.uniforms.uSurfaceSeed) material.uniforms.uSurfaceSeed.value = identitySeed',
              1,
          )
          text = text.replace(
              '    0.955,\n    collisionImpactFacing',
              '    0.92,\n    collisionImpactFacing',
              1,
          )
          text = text.replace(
              '  color = mix(color, vec3(1.0, 0.34, 0.12), collisionHeat * 0.18 + collisionCrack * 0.28);',
              '  color = mix(color, vec3(1.0, 0.34, 0.12), collisionHeat * 0.34 + collisionCrack * 0.44);',
              1,
          )
          text = text.replace(
              '  color += vec3(1.0, 0.76, 0.46) * collisionImpactMask * uCollisionImpactFlash * 0.5;',
              '  color += vec3(1.0, 0.76, 0.46) * collisionImpactMask * uCollisionImpactFlash * 0.7;',
              1,
          )
          text = text.replace(
              'function applySurvivorImpact(material: THREE.ShaderMaterial, now: number) {',
              'function applySurvivorImpact(material: THREE.ShaderMaterial, object: THREE.Object3D, now: number) {',
              1,
          )
          start = text.index('function applySurvivorImpact(')
          end = text.index('function applyCollisionProductReveal(', start)
          block = text[start:end]
          needle = '  const direction = material.uniforms.uCollisionImpactDirection?.value\n  if (direction instanceof THREE.Vector3) {'
          replacement = needle + '\n    const worldQuaternion = new THREE.Quaternion()\n    object.getWorldQuaternion(worldQuaternion)'
          if needle not in block:
              raise SystemExit('survivor impact direction start not found')
          block = block.replace(needle, replacement, 1)
          normal_end = '    ).normalize()'
          if normal_end not in block:
              raise SystemExit('survivor impact normalize not found')
          block = block.replace(
              normal_end,
              '    ).applyQuaternion(worldQuaternion.invert()).normalize()',
              1,
          )
          text = text[:start] + block + text[end:]
          text = text.replace(
              '      applySurvivorImpact(material, now)',
              '      applySurvivorImpact(material, object, now)',
              1,
          )
          bridge.write_text(text, encoding='utf-8')

          regression = Path('scripts/nonStellarDestructionVisualRegression.py')
          text = regression.read_text(encoding='utf-8')
          text = text.replace('wait_until(destruction_started_at, 2.10)', 'wait_until(destruction_started_at, 2.25)', 1)
          text = text.replace("'final_debris': 2.10,", "'final_debris': 2.25,", 1)
          regression.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          heading = '## [0.19.3] - 2026-08-26'
          if heading not in text:
              section = '\n'.join([
                  heading,
                  '',
                  '### Changed',
                  '- 비항성 충돌의 시각 outcome을 `survivor`, `absorbed`, `disrupted`, `merged-survivor`로 분리하고, ID lineage는 충돌 결과 연결에만 사용하며 파괴 판정 근거로 사용하지 않도록 변경했습니다.',
                  '- 실제 `disrupted` 천체의 1.5초 handoff는 실제 접촉 법선에서 균열이 시작해 주변으로 전파된 뒤 구조 붕괴와 파편 reveal로 이어지도록 변경했습니다.',
                  '- 흡수 충돌의 작은 피흡수체는 전체 구면 dissolve 대신 접촉면 쪽으로 압축·소멸되는 짧은 전환을 사용하도록 분리했습니다.',
                  '',
                  '### Fixed',
                  '- 큰 천체가 작은 천체를 흡수해 대부분의 질량과 실루엣을 유지하는 경우에도 큰 천체 전체에 fracture/dissolve snapshot이 생성되던 문제를 수정했습니다.',
                  '- 생존 천체에는 destruction snapshot·전역 crack·global discard·opacity fade를 생성하지 않고, 실제 접촉점 주변 약 10% 구면 범위에만 700ms 이내의 국소 impact 흔적을 적용하도록 수정했습니다.',
                  '- 충돌 후 살아남은 큰 천체 위에 동일 크기의 검은 shell/ghost sphere가 겹치던 현상을 제거했습니다.',
                  '- survivor의 표면 정체성 seed와 렌더 body lookup seed를 분리해 흡수 후 비항성 천체가 self-luminous/glow 상태로 고착될 수 있던 경로를 제거했습니다.',
                  '- world-space contact normal을 body mesh local-space로 변환해 회전된 천체에서도 국소 충돌 흔적이 실제 접촉면에 고정되도록 수정했습니다.',
                  '',
                  '### Added',
                  '- survivor absorption과 actual disruption을 분리 검증하는 브라우저 시각 회귀를 추가하고 contact/150/350/700/1100/1600ms 단계 캡처 및 survivor 반대 hemisphere 변화 검사를 추가했습니다.',
                  '',
                  '',
              ])
              marker = '## [0.19.2] - 2026-08-26'
              if marker not in text:
                  raise SystemExit('v0.19.2 changelog marker not found')
              changelog.write_text(text.replace(marker, section + marker, 1), encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Versioning regression
        run: npm run check:version
      - name: Physics regression
        run: npm run check:physics
      - name: TypeScript compile
        run: npx tsc -b
      - name: Vite build
        run: npx vite build
      - name: Install browser visual regression runtime
        run: python -m pip install --disable-pip-version-check --quiet selenium==4.35.0 pillow==11.3.0
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/3bp-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/3BP/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/3bp-preview.log
          exit 1

      - name: Stellar collision browser visual regression
        run: python scripts/visualStellarCollisionRegression.py
      - name: Strict stellar collision visual gate
        run: python scripts/strictStellarCollisionVisualGate.py
      - name: Collision watch browser visual regression
        run: python scripts/collisionWatchVisualRegression.py
      - name: Non-stellar destruction browser visual regression
        run: python scripts/nonStellarDestructionVisualRegression.py
      - name: Survivor absorption browser visual regression
        run: python scripts/survivorAbsorptionVisualRegression.py
      - name: Actual disruption browser visual regression
        if: always()
        run: python scripts/actualDisruptionVisualRegression.py

      - name: Upload visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collision-visual-regressions
          path: |
            visual-regression-artifacts
            collision-watch-visual-artifacts
            non-stellar-destruction-visual-artifacts
            survivor-absorption-visual-artifacts
            actual-disruption-visual-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Commit validated v0.19.3 changes
        if: github.event_name == 'push' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md src/rendering/bodyLighting.ts src/rendering/liveCollisionVfxBridge.ts scripts/nonStellarDestructionVisualRegression.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: keep survivor impacts local and surface-stable"
          git push
