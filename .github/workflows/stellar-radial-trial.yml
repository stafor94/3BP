name: Stellar radial mobile trial
on:
  push:
    branches: [fix/stellar-radial-halo]
permissions:
  contents: read
jobs:
  mobile-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: python -m pip install --quiet selenium==4.35.0 pillow==11.3.0
      - name: Capture candidate A with existing production helpers
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          python scripts/stellarRadialTrial.py candidate-a
      - name: Capture candidate B with stronger radial redistribution
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/rendering/stellarCoronaMaterial.ts')
          s=p.read_text().replace('distanceR + 1.0 * outerDistance', 'distanceR + 2.0 * outerDistance').replace('distanceR - 1.305067', 'distanceR - 1.275631')
          p.write_text(s)
          PY
          ./node_modules/.bin/vite build
          python scripts/stellarRadialTrial.py candidate-b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stellar-radial-mobile-trial
          path: stellar-radial-artifacts
          retention-days: 7
