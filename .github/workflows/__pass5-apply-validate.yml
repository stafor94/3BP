name: Pass 5 Apply and Validate

on:
  push:
    branches:
      - feat/stellar-corona-compact

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Repair generated regression literal
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/stellarRenderingRegression.ts')
          source = path.read_text(encoding='utf-8')
          old = """bodyLightingSource.includes('glowOuter.visible = false
              glowOuter.material.opacity = 0')"""
          new = "bodyLightingSource.includes('glowOuter.visible = false\\n    glowOuter.material.opacity = 0')"
          if old not in source:
              raise SystemExit('expected generated regression literal was not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stellarRenderingRegression.ts
          git diff --cached --check
          git commit -m "test: fix stellar corona regression literal"
          git push origin HEAD:feat/stellar-corona-compact
      - name: Install dependencies
        run: npm install
      - name: Stellar rendering structural regression
        run: npx --yes tsx@4.20.5 scripts/stellarRenderingRegression.ts
      - name: Physics regression
        run: npm run check:physics
      - name: Build and typecheck
        run: npm run build
      - name: Install browser visual regression runtime
        run: python -m pip install --disable-pip-version-check --quiet selenium==4.35.0 pillow==11.3.0
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/3bp-pass5-preview.log 2>&1 &
          echo $! > /tmp/3bp-pass5-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/3BP/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/3bp-pass5-preview.log
          exit 1
      - name: Pass 5 mobile 390x844 A/B
        env:
          STELLAR_CORONA_BASELINE_REF: 93bb0d481464e633d6c15e91ecbcac51040c3555
        run: python scripts/stellarCoronaVisualRegression.py
      - name: Emit review image even after visual assertion failure
        if: always()
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import base64, io
          root = Path('stellar-corona-artifacts')
          paths = [
              ('Pass 4 normal', root / 'baseline-normal-mobile.png'),
              ('Pass 5 normal', root / 'current-normal-mobile.png'),
              ('Pass 4 large', root / 'baseline-large-mobile.png'),
              ('Pass 5 large', root / 'current-large-mobile.png'),
          ]
          available = [(label, path) for label, path in paths if path.exists()]
          if not available:
              print('No Pass 5 review captures available')
              raise SystemExit(0)
          first = Image.open(available[0][1]).convert('RGB')
          margin, label_h = 10, 28
          cols = 2
          rows = (len(available) + cols - 1) // cols
          sheet = Image.new('RGB', (first.width * cols + margin * (cols + 1), (first.height + label_h) * rows + margin), (12,14,20))
          draw = ImageDraw.Draw(sheet)
          for index, (label, path) in enumerate(available):
              row, col = divmod(index, cols)
              x = margin + col * (first.width + margin)
              y = margin + row * (first.height + label_h)
              draw.text((x, y), label, fill=(235,238,245))
              sheet.paste(Image.open(path).convert('RGB'), (x, y + label_h))
          sheet.thumbnail((820, 1180))
          out = root / 'workflow-review-contact-sheet.jpg'
          sheet.save(out, quality=82, optimize=True)
          buffer = io.BytesIO()
          sheet.save(buffer, format='JPEG', quality=82, optimize=True)
          encoded = base64.b64encode(buffer.getvalue()).decode('ascii')
          print('PASS5_REVIEW_BASE64_BEGIN')
          for i in range(0, len(encoded), 120):
              print(encoded[i:i+120])
          print('PASS5_REVIEW_BASE64_END')
          PY
      - name: Upload Pass 5 mobile artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass5-stellar-corona-validation
          path: stellar-corona-artifacts
          if-no-files-found: warn
          retention-days: 7
