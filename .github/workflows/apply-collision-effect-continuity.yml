name: Apply collision effect continuity

on:
  push:
    branches:
      - fix/natural-collision-camera-v01723

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/natural-collision-camera-v01723
          fetch-depth: 0
      - name: Apply source patch
        run: node scripts/applyCollisionEffectContinuityPatch.mjs
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/applyCollisionEffectContinuityPatch.mjs .github/workflows/apply-collision-effect-continuity.yml
          git add src/rendering/collisionEffectRenderer.ts CHANGELOG.md
          git commit -m "fix: crossfade stellar collision effect handoff"
          git push origin HEAD:fix/natural-collision-camera-v01723
