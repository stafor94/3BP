name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Install browser visual regression runtime
        run: python -m pip install --disable-pip-version-check --quiet selenium==4.35.0 pillow==11.3.0
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/3bp-preview.log 2>&1 &
          echo $! > /tmp/3bp-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/3BP/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/3bp-preview.log
          exit 1
      - name: Stellar collision browser visual regression
        run: python scripts/visualStellarCollisionRegression.py
      - name: Strict stellar collision visual gate
        run: python scripts/strictStellarCollisionVisualGate.py
      - name: Upload stellar collision visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellar-collision-visual-regression
          path: visual-regression-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
