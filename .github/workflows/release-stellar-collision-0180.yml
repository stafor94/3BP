name: Validate 0.18.0 stellar collision release

on:
  push:
    branches: [fix/stellar-collision-outcomes-vfx]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[release-0180-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/stellar-collision-outcomes-vfx
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Align release metadata
        run: python3 .github/scripts/release-stellar-collision-0180.py
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Physics regression
        run: npm run check:physics
      - name: TypeScript compile
        run: npx tsc -b
      - name: Vite build
        run: npx vite build
      - name: Commit release alignment
        run: |
          rm .github/workflows/release-stellar-collision-0180.yml
          rm .github/scripts/release-stellar-collision-0180.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release stellar collision model as v0.18.0 [release-0180-applied]"
          git push origin HEAD:fix/stellar-collision-outcomes-vfx
