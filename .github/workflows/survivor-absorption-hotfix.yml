name: Survivor Absorption Hotfix Verification

on:
  push:
    branches:
      - fix/survivor-absorption-primary-mask

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Install browser visual regression runtime
        run: python -m pip install --disable-pip-version-check --quiet selenium==4.35.0 pillow==11.3.0
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/3bp-preview.log 2>&1 &
          echo $! > /tmp/3bp-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/3BP/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/3bp-preview.log
          exit 1
      - name: Survivor absorption browser visual regression
        run: python scripts/survivorAbsorptionVisualRegression.py
      - name: Upload survivor absorption captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survivor-absorption-hotfix-verification
          path: survivor-absorption-visual-artifacts
          if-no-files-found: warn
          retention-days: 7
