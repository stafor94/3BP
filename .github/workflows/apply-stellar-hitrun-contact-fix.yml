name: Apply stellar hit-run contact correction

on:
  push:
    branches: [fix/stellar-hitrun-contact-color-v0181]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[stellar-hitrun-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/stellar-hitrun-contact-color-v0181
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply fix
        run: python3 .github/scripts/apply-stellar-hitrun-contact-fix.py
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Physics regression
        run: npm run check:physics
      - name: TypeScript compile
        run: npx tsc -b
      - name: Vite build
        run: npx vite build
      - name: Commit validated fix
        run: |
          rm .github/workflows/apply-stellar-hitrun-contact-fix.yml
          rm .github/scripts/apply-stellar-hitrun-contact-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: prevent elastic-looking stellar grazes and whiteout [stellar-hitrun-fix-applied]"
          git push origin HEAD:fix/stellar-hitrun-contact-color-v0181
