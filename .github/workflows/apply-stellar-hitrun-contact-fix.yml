name: Apply stellar hit-run contact correction

on:
  push:
    branches: [fix/stellar-hitrun-contact-color-v0181]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[stellar-hitrun-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/stellar-hitrun-contact-color-v0181
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Tune applicator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-stellar-hitrun-contact-fix.py')
          text = path.read_text()
          old = """    if count != 1:\n        raise RuntimeError(f\"{path}: expected one literal match, found {count}: {old[:120]!r}\")\n    write(path, text.replace(old, new, 1))"""
          new = """    if count < 1:\n        raise RuntimeError(f\"{path}: expected at least one literal match, found {count}: {old[:120]!r}\")\n    if count > 1:\n        print(f\"{path}: selecting first of {count} intentional matches: {old[:80]!r}\")\n    write(path, text.replace(old, new, 1))"""
          if old not in text:
              raise SystemExit('replace_once helper target not found')
          text = text.replace(old, new, 1)

          needle = """    // A stellar hit-and-run must actually have enough relative energy to escape\n    // and must remain a shallow surface-skimming encounter. Sub-escape contacts"""
          insert = """    // Unequal-mass, strongly coupled impacts can strip the smaller star even\n    // when contact is first detected near the photospheric boundary. Preserve\n    // this physical partial-disruption branch before evaluating a true graze.\n    if (\n      massRatio < 0.82 &&\n      speedRatio > 0.95 &&\n      speedRatio < 2.3 &&\n      headOn > 0.34 &&\n      grazing < 0.86 &&\n      partialSeverity > 0.16\n    ) {\n      const strippedFractionOfSmaller = clamp(\n        0.055 + partialSeverity * 0.14 + (1 - massRatio) * 0.03,\n        0.055,\n        0.2,\n      )\n      return {\n        mode: 'disrupt',\n        ejectaFraction: smallerMassFraction * strippedFractionOfSmaller,\n        stellarOutcome: 'partialDisruption',\n      }\n    }\n\n    // A stellar hit-and-run must actually have enough relative energy to escape\n    // and must remain a shallow surface-skimming encounter. Sub-escape contacts"""
          if needle not in text:
              raise SystemExit('stellar classification insertion target not found')
          path.write_text(text.replace(needle, insert, 1))
          PY
      - name: Apply fix
        run: python3 .github/scripts/apply-stellar-hitrun-contact-fix.py
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Physics regression
        run: npm run check:physics
      - name: TypeScript compile
        run: npx tsc -b
      - name: Vite build
        run: npx vite build
      - name: Commit validated fix
        run: |
          rm .github/workflows/apply-stellar-hitrun-contact-fix.yml
          rm .github/scripts/apply-stellar-hitrun-contact-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: prevent elastic-looking stellar grazes and whiteout [stellar-hitrun-fix-applied]"
          git push origin HEAD:fix/stellar-hitrun-contact-color-v0181
