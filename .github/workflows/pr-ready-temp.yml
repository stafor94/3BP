name: Ready PR Temp

on:
  push:
    branches:
      - feat/pass5-dense-starfield

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR 116 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 116 --repo stafor94/3BP
