name: Stellar Photosphere Quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rendering/bodyLighting.ts'
      - 'src/rendering/simulationRenderer.ts'
      - 'src/rendering/stellarPhotosphereMaterial.ts'
      - 'src/rendering/stellarCoronaMaterial.ts'
      - 'src/rendering/stellarRenderProfile.ts'
      - 'src/visualRegression/StellarTopologyVisualHarness.tsx'
      - 'scripts/stellarRenderingRegression.ts'
      - 'scripts/stellarPhotosphereVisualRegression.py'
      - 'scripts/stellarPhotospherePass1VisualRegression.py'
      - 'scripts/stellarRenderPathVisualRegression.py'
      - 'scripts/stellarGranulationLodVisualRegression.py'
      - 'scripts/stellarLimbVisualRegression.py'
      - 'scripts/stellarCoronaVisualRegression.py'
      - 'scripts/stellarHdrVisualRegression.py'
      - '.github/workflows/stellar-photosphere-quality.yml'

permissions:
  contents: read

jobs:
  stellar-photosphere-corona-ab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build and regression checks
        run: npm run build
      - name: Stellar rendering structural regression
        run: npx --yes tsx@4.20.5 scripts/stellarRenderingRegression.ts
      - name: Install browser visual regression runtime
        run: python -m pip install --disable-pip-version-check --quiet selenium==4.35.0 pillow==11.3.0
      - name: Start production preview
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/3bp-stellar-preview.log 2>&1 &
          echo $! > /tmp/3bp-stellar-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/3BP/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/3bp-stellar-preview.log
          exit 1
      - name: Pass 1 cellular-removal temperature mobile A/B
        env:
          STELLAR_PASS1_BASELINE_REF: 09153897130cd25d35820174b2b81b5dea5b80c7
        run: python scripts/stellarPhotospherePass1VisualRegression.py
      - name: Pass 1 screen-space stellar surface LOD regression
        env:
          STELLAR_SURFACE_LOD_BASELINE_REF: 09153897130cd25d35820174b2b81b5dea5b80c7
        run: python scripts/stellarGranulationLodVisualRegression.py
      - name: Stellar limb and edge mobile A/B regression
        env:
          STELLAR_LIMB_BASELINE_REF: 284d113e82523f90ae5ca92444f0eab0bbb98b26
        run: python scripts/stellarLimbVisualRegression.py
      - name: Compact stellar corona mobile A/B regression
        env:
          STELLAR_CORONA_BASELINE_REF: 93bb0d481464e633d6c15e91ecbcac51040c3555
        run: python scripts/stellarCoronaVisualRegression.py
      - name: Stellar HDR and temperature-color mobile A/B regression
        env:
          STELLAR_HDR_BASELINE_REF: fe1d138268a40ce7707df64ac60a0ab384a995bc
        run: python scripts/stellarHdrVisualRegression.py
      - name: Upload Pass 1 temperature A/B captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellar-photosphere-pass1-mobile-ab
          path: stellar-pass1-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Pass 1 surface LOD captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellar-surface-screen-space-lod
          path: stellar-surface-lod-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload stellar limb mobile A/B captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellar-limb-pass4-mobile-ab
          path: stellar-limb-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload compact stellar corona A/B captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellar-corona-pass5-mobile-ab
          path: stellar-corona-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload stellar HDR temperature A/B captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellar-hdr-pass6-mobile-ab
          path: stellar-hdr-artifacts
          if-no-files-found: warn
          retention-days: 7
