name: Stellar Photosphere Quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rendering/bodyLighting.ts'
      - 'src/rendering/simulationRenderer.ts'
      - 'src/rendering/stellarPhotosphereMaterial.ts'
      - 'src/rendering/stellarCoronaMaterial.ts'
      - 'src/rendering/stellarRenderProfile.ts'
      - 'src/visualRegression/StellarTopologyVisualHarness.tsx'
      - 'src/visualRegression/productionCameraHandoffFixture.ts'
      - 'scripts/stellarPhotographicVisualRegression.py'
      - 'scripts/stellarOuterHaloVisualRegression.py'
      - 'docs/stellar-photographic-target.md'
      - 'scripts/stellarRenderingRegression.ts'
      - 'scripts/stellarFinalRenderStructureRegression.ts'
      - 'scripts/stellarPhotosphereVisualRegression.py'
      - 'scripts/stellarPhotospherePass1VisualRegression.py'
      - 'scripts/stellarPhotospherePass2VisualRegression.py'
      - 'scripts/stellarPhotospherePass2VisualRegressionRunner.py'
      - 'scripts/stellarPhotospherePass3RadialRegression.py'
      - 'scripts/stellarRenderPathVisualRegression.py'
      - 'scripts/stellarCellularPhotosphereVisualRegression.py'
      - 'scripts/stellarGranulationLodVisualRegression.py'
      - 'scripts/stellarGranulationLodScreenSizeAudit.py'
      - 'scripts/stellarLimbVisualRegression.py'
      - 'scripts/stellarCoronaVisualRegression.py'
      - 'scripts/stellarCoronaPass5CompatibilityRunner.py'
      - 'scripts/stellarHdrVisualRegression.py'
      - 'scripts/stellarProductionIntegrationVisualRegression.py'
      - 'scripts/stellarProductionIntegrationVisualRegressionRunner.py'
      - 'scripts/stellarHeliosFinalVisualRegression.py'
      - '.github/workflows/stellar-photosphere-quality.yml'

permissions:
  contents: read

jobs:
  stellar-photosphere-corona-ab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build and regression checks
        run: npm run build
      - name: Stellar rendering structural regression
        run: npx --yes tsx@4.20.5 scripts/stellarRenderingRegression.ts
      - name: Final stellar 1+1 draw structure regression
        run: npx --yes tsx@4.20.5 scripts/stellarFinalRenderStructureRegression.ts
      - name: Install browser visual regression runtime
        run: python -m pip install --disable-pip-version-check --quiet selenium==4.35.0 pillow==11.3.0
      - name: Start production preview
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/3bp-stellar-preview.log 2>&1 &
          echo $! > /tmp/3bp-stellar-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/3BP/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/3bp-stellar-preview.log
          exit 1
      - name: Photographic production light A/B regression
        run: python scripts/stellarPhotographicVisualRegression.py
      - name: Latest-main outer halo production A/B and frame pacing
        run: python scripts/stellarOuterHaloVisualRegression.py
      - name: Upload photographic production A/B captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellar-photographic-production-ab
          path: stellar-photographic-artifacts
          if-no-files-found: error
          retention-days: 7
