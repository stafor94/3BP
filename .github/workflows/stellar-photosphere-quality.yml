name: Stellar Photosphere Quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/rendering/stellarPhotosphereMaterial.ts'
      - 'src/rendering/bodyLighting.ts'
      - 'src/starColors.ts'
      - 'src/rendering/stellarRenderProfile.ts'
      - 'src/visualRegression/StellarTopologyVisualHarness.tsx'
      - 'scripts/stellarPhotosphereVisualRegression.py'
      - 'scripts/stellarCellularPhotosphereVisualRegression.py'
      - 'scripts/stellarGranulationLodVisualRegression.py'
      - 'scripts/stellarRenderingRegression.ts'
      - '.github/workflows/stellar-photosphere-quality.yml'

permissions:
  contents: read

jobs:
  stellar-photosphere-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Full build and regressions
        run: npm run build
      - name: Install browser visual regression runtime
        run: python -m pip install --disable-pip-version-check --quiet selenium==4.35.0 pillow==11.3.0
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/3bp-stellar-preview.log 2>&1 &
          echo $! > /tmp/3bp-stellar-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/3BP/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/3bp-stellar-preview.log
          exit 1
      - name: Pass 2 cellular photosphere mobile A/B regression
        env:
          STELLAR_PHOTOSPHERE_BASELINE_REF: 2da4afda8e6d62d35f87688f5ec760ae67287d6f
        run: python scripts/stellarCellularPhotosphereVisualRegression.py
      - name: Pass 3 screen-space granulation LOD mobile regression
        env:
          STELLAR_GRANULATION_LOD_BASELINE_REF: 901b2dd596cb3a0f240853aa851981087f92ae04
        run: python scripts/stellarGranulationLodVisualRegression.py
      - name: Upload cellular photosphere mobile A/B captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellar-photosphere-cellular-mobile-ab
          path: stellar-photosphere-visual-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload screen-space LOD mobile captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellar-granulation-screen-space-lod
          path: stellar-granulation-lod-artifacts
          if-no-files-found: warn
          retention-days: 7
