name: Prepare 0.18.12 release metadata

on:
  push:
    branches:
      - fix/collision-watch-duration-tracking

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/collision-watch-duration-tracking
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare package and changelog
        run: node scripts/prepare01812.mjs
      - name: Commit release metadata
        run: |
          if git diff --quiet -- package.json CHANGELOG.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json CHANGELOG.md
          git commit -m 'chore: release 0.18.12'
          git push origin HEAD:fix/collision-watch-duration-tracking
