name: Pass 5 Patch Apply Temp

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-pass5:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply Pass 5 implementation
        shell: bash
        run: |
          if [ "$(node -p "require('./package.json').version")" = "0.24.2" ]; then
            echo "Pass 5 patch already applied"
            rm -rf .pass5-transfer .pass5-temp
          else
            cat .pass5-transfer/chunk* > /tmp/pass5.b64
            echo "5a3cf52b0622cdfdf94216a6623b669735acc34b8e5619994a9251ef0c30cc1f  /tmp/pass5.b64" | sha256sum -c -
            base64 -d /tmp/pass5.b64 | gzip -d > /tmp/pass5.patch
            echo "1053efe042b216c613fae4a0d9510f2e13421052e7e59b5728f4e6834fda73f7  /tmp/pass5.patch" | sha256sum -c -
            git apply --check /tmp/pass5.patch
            git apply /tmp/pass5.patch
            rm -rf .pass5-transfer .pass5-temp
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A CHANGELOG.md package.json scripts/spaceBackgroundRegression.mjs scripts/spaceBackgroundVisualRegression.py src/rendering/spaceBackground.ts .pass5-transfer .pass5-temp
          if git diff --cached --quiet; then
            echo "No Pass 5 code changes to commit"
            exit 0
          fi
          git commit -m "feat: implement dense visible starfield Pass 5"
          git push origin HEAD:${{ github.head_ref }}
