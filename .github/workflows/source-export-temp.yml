name: Pass 5 Patch Apply Temp

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-pass5:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply Pass 5 implementation
        shell: bash
        env:
          PATCH_B64: |
            
        run: |
          if [ "$(node -p "require('./package.json').version")" = "0.24.2" ]; then
            echo "Pass 5 patch already applied"
            exit 0
          fi
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/pass5.patch
          git apply --check /tmp/pass5.patch
          git apply /tmp/pass5.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/space-background-quality.yml CHANGELOG.md package.json scripts/spaceBackgroundRegression.mjs scripts/spaceBackgroundVisualRegression.py src/rendering/spaceBackground.ts
          git commit -m "feat: implement dense visible starfield Pass 5"
          git push origin HEAD:${{ github.head_ref }}
